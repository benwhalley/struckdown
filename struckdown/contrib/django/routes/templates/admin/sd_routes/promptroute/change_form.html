{% extends "admin/change_form.html" %}
{% block after_related_objects %}{{ block.super }}
{% if sd_examples %}
<fieldset class="module sd-examples">
  <h2>Examples</h2>
  <p class="help">With this route's address and its first active token filled in.</p>
  {% for ex in sd_examples %}
  <div class="sd-example">
    <div class="sd-example-head">
      <strong>{{ ex.title }}</strong> <span class="help">{{ ex.note }}</span>
      <button type="button" class="button sd-copy">Copy</button>
    </div>
    <pre class="sd-fill-origin">{{ ex.code }}</pre>
  </div>
  {% endfor %}
</fieldset>
{% endif %}
{% endblock %}
